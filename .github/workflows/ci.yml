name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: pytest -v

      - name: Smoke test com Gunicorn (start.sh)
        run: |
          PORT=8000 ./start.sh > gunicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q "Downloader"
          status=$(curl -s -o resposta.json -w "%{http_code}" -X POST http://127.0.0.1:8000/download \
            -H "Content-Type: application/json" \
            -d '{"url": "http://169.254.169.254/latest/meta-data/", "format": "mp3"}')
          cat resposta.json
          test "$status" = "400"
          # O Gunicorn subiu com o timeout configurado no start.sh
          ps -eo args | grep "[g]unicorn" | grep -q -- "--timeout 300"
          cat gunicorn.log
