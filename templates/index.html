<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}?v=1">

    <title>Downloader & Conversor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            background: #111;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.8), 0 0 40px rgba(0, 191, 255, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        h1 {
            color: #8a2be2;
            text-shadow: 0 0 10px #8a2be2;
        }

        p {
            color: #00bfff;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #00bfff;
            border-radius: 5px;
            background: #222;
            color: white;
            box-sizing: border-box;
            margin: 10px 0;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus, select:focus {
            border-color: #8a2be2;
            box-shadow: 0 0 10px #8a2be2;
        }

        button {
            width: 100%;
            background: linear-gradient(45deg, #8a2be2, #00bfff);
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 20px #8a2be2, 0 0 30px #00bfff;
            transform: scale(1.05);
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #00bfff;
            text-shadow: 0 0 10px #8a2be2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Downloader & Conversor 🎶🎶</h1>
        <p>Baixe e converta vídeos e áudios facilmente!</p>

        <input type="text" id="url" placeholder="Cole o link aqui..." />
        
        <select id="format">
            <option value="mp3">MP3</option>
            <option value="wav">WAV</option>
            <option value="ogg">OGG</option>
            <option value="flac">FLAC</option>
            <option value="aac">AAC</option>
        </select>

        <button onclick="downloadMedia()">📥 Baixar e Converter</button>

        <p id="status"></p>
    </div>

    <script>
        // Mensagens vindas do servidor entram sempre como texto (textContent),
        // nunca como HTML, para não executar conteúdo injetado.
        async function downloadMedia() {
            const url = document.getElementById("url").value;
            const format = document.getElementById("format").value;
            const status = document.getElementById("status");

            if (!url) {
                status.textContent = "❌ Insira um link válido!";
                return;
            }

            status.textContent = "⏳ Processando...";

            try {
                const response = await fetch("/download", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url, format })
                });

                const data = await response.json();

                if (data.success && typeof data.file === "string" && data.file.startsWith("/download-file?name=")) {
                    const link = document.createElement("a");
                    link.href = data.file;
                    link.download = "";
                    link.textContent = "Clique aqui";
                    link.style.color = "#8a2be2";
                    status.textContent = "✅ Download concluído: ";
                    status.appendChild(link);
                } else {
                    status.textContent = `❌ Erro: ${String(data.error || "falha desconhecida")}`;
                }
            } catch (error) {
                status.textContent = "❌ Erro ao conectar ao servidor!";
            }
        }
    </script>
</body>
</html>
